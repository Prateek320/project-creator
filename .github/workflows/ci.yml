name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runners are pinned: ubuntu-latest moves to new releases before Playwright supports them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and service tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  postgres:
    name: Migrations, seed and jobs on real Postgres
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: proovd }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/proovd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Re-applying migrations is a no-op
        run: npm run db:migrate
      - name: Seed refuses outside the demo
        run: "! APP_ENV=staging npm run db:seed"
      - name: Seed the demo (funding and payouts run through the job queue)
        run: APP_ENV=demo npm run db:seed
      - name: Drain any remaining jobs
        run: APP_ENV=demo npx tsx scripts/worker.ts --once
      - name: Ledger integrity
        run: APP_ENV=demo npm run db:smoke

  e2e:
    name: End-to-end (demo and staging)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
