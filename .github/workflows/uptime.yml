# Uptime check: calls /api/health on each deployed environment every 10 minutes.
# Set the repository variable UPTIME_URLS to space-separated health URLs, e.g.
#   https://staging.proovd.in/api/health https://proovd.in/api/health
# A failed run emails whoever last changed this schedule (GitHub's rule for scheduled workflows).
# GitHub may delay scheduled runs under load; add an external monitor before real customers arrive.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    if: vars.UPTIME_URLS != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check health endpoints
        env:
          URLS: ${{ vars.UPTIME_URLS }}
        run: |
          failed=0
          for url in $URLS; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 --retry-all-errors "$url" || echo 000)
            echo "$url -> $code $(head -c 200 /tmp/body 2>/dev/null)"
            [ "$code" = "200" ] || failed=1
          done
          exit $failed
